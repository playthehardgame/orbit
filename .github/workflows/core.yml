name: Core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: python -m compileall -q src/orbit scripts tests
      - name: Source-fresh core tests and recorded-intent replay
        shell: bash
        run: |
          set +e
          python scripts/check_core.py > core.log 2>&1
          status=$?
          cat core.log
          if [ "$status" -ne 0 ]; then
            # Surface the failure as a public annotation (job logs need a login).
            {
              echo "env: SHELL=${SHELL:-<unset>} HOME=$HOME python=$(python -V 2>&1) cpus=$(nproc)"
              grep -E '^(FAIL|ERROR):' core.log | head -20
              grep -E -A12 '^(FAIL|ERROR):' core.log | head -60
            } > core-summary.txt
            msg=$(head -c 3500 core-summary.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=core checks failed::${msg}"
          fi
          exit "$status"
      - name: Check changed-line whitespace
        run: git diff --check HEAD^ HEAD
