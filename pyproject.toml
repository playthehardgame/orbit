[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.0.1"
description = "Minimal local Orbit runtime centered on native orbit-server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Opt-in telemetry only (ORBIT_OTEL=1); never required. See docs/TELEMETRY.md.
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
orbit = "orbit.terminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orbit.native_llama" = [
  "model_registry.json",
  "vendor/README.md",
  "vendor/THIRD_PARTY_NOTICES.md",
  "vendor/lib/*",
  "vendor/shim/*",
  "vendor/source/llama.cpp/**/*",
]
